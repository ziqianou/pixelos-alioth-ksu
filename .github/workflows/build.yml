name: Build PixelOS alioth KernelSU kernel

on:
  workflow_dispatch:
    inputs:
      rom_url:
        description: "PixelOS alioth ROM zip (must contain payload.bin)"
        required: true
        default: "https://download.pixelos.net/seventeen/alioth/PixelOS_alioth-17.0-20261112-0826.zip"
      kernel_src_url:
        description: "Kernel source tarball (top-level dir is stripped)"
        required: true
        # Exact stock PixelOS-Devices source for the 20261112 ROM (cip136/st20).
        # Public mirror of the kernel that ships in PixelOS_alioth-17.0-20261112.
        default: "https://github.com/PixelOS-Devices/android_kernel_xiaomi_sm8250/archive/f914d0b2461384fb80680ca7ebc8ec54df0a28a1.tar.gz"
      jobs:
        description: "make -j value"
        required: false
        default: "4"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/lib/jvm \
            /usr/local/lib/node_modules /usr/local/.ghcup /opt/az \
            /usr/share/swift /usr/lib/llvm-*
          sudo apt-get clean
          df -h

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev libelf-dev ccache \
            python3 zip unzip lz4 cpio kmod curl git \
            gcc-aarch64-linux-gnu
          sudo apt-get install -y gcc-arm-linux-gnueabi || \
            sudo apt-get install -y gcc-arm-linux-gnueabihf || true

      - name: Install AOSP clang r547379
        run: |
          # The shipped kernel is built with the AOSP prebuilt toolchain that
          # the maintainer's build.sh points at: clang-r547379 (clang 20.0.0).
          # Ubuntu's clang is a different compiler: different inlining and
          # stack-frame behaviour, and it cannot reproduce the stock build.
          mkdir -p "$RUNNER_TEMP/clang-r547379"
          curl -fL --retry 3 --retry-delay 5 --connect-timeout 30 \
            -o clang.tar.gz \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r547379.tar.gz"
          tar xzf clang.tar.gz -C "$RUNNER_TEMP/clang-r547379"
          rm -f clang.tar.gz
          "$RUNNER_TEMP/clang-r547379/bin/clang" --version | head -1
          echo "$RUNNER_TEMP/clang-r547379/bin" >> "$GITHUB_PATH"

      - name: Fetch kernel source
        run: |
          mkdir -p kernel
          curl -L --retry 3 --retry-delay 5 --connect-timeout 30 \
            -o kernel-src.tar.gz "${{ inputs.kernel_src_url }}"
          tar xzf kernel-src.tar.gz -C kernel --strip-components=1
          test -f kernel/Makefile

      - name: Add KernelSU source
        run: |
          # kernelsu-susfs.diff adds the drivers/{Kconfig,Makefile} entries, so
          # only drop the current KernelSU-Next source in here.
          cp -r ksu/drivers_kernelsu kernel/drivers/kernelsu

      - name: Apply kernel-side KSU hooks
        run: |
          # Full KSU-Next/SUSFS manual-hook integration. The stock tree ships
          # none of it: this adds fs/susfs.c, include/linux/susfs*.h and the
          # ksu_handle_* hooks (execve/open/stat/faccessat/reboot/...).
          patch -p1 -d kernel < patches/kernelsu-susfs.diff
          # Android 17 libbase reads exactly fstat(2)'s st_size, so the
          # appended KSU init.rc is only seen if newfstat reports it.
          patch -p1 -d kernel < patches/ksu-newfstat-hook.patch
          # The stock 20261112 source already carries CAP_CHECKPOINT_RESTORE (40)
          # and the matching SELinux classmap entry, so caps are not patched here.
          # Keep the 4.19 lru_size debug check from tainting the kernel.
          patch -p1 -d kernel < patches/memcg-lru-size-warn.patch
          # avc_spoof only works when slow_avc_audit feeds tsid to KSU.
          patch -p1 -d kernel < patches/ksu-avc-spoof-hook.patch
          # Qualcomm's mixed big.LITTLE feature tables set TAINT_CPU_OUT_OF_SPEC
          # on every boot (/proc/sys/kernel/tainted = 4), which root-detection
          # scanners flag. Keep the warning, drop the taint.
          patch -p1 -d kernel < patches/no-cpu-taint.patch
          # f914d0b carries the CIP backport of "nf_queue: hold bridge
          # skb->dev while queued". It pins skb->dev for every queued packet,
          # but on the IP LOCAL_OUT path skb->dev can still point at a device
          # from a previous transmission (ip_output() updates it later), which
          # panics in dev_hold() after a route/interface change. Only pin it
          # for bridged packets; that is the case the backport was written for.
          patch -p1 -d kernel < patches/nf-queue-skb-dev-ip-guard.patch

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ hashFiles('patches/**','config/**','ksu/**') }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Configure ccache
        run: |
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
          echo "CCACHE_COMPRESS=true" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=3G" >> "$GITHUB_ENV"
          ccache --version | head -1

      - name: Configure
        run: |
          cd kernel
          # The tree is dirty (patch + KSU source), which makes setlocalversion
          # append "+" to the vermagic. Drop the git metadata so vermagic is exact.
          rm -rf .git
          printf -- '-cip136' > localversion-cip
          printf -- '-st20' > localversion-st
          mkdir -p out
          # Use the exact .config embedded in the shipped 20261112 boot.img.
          # build.sh's chain (vendor/kona-perf_defconfig + the two xiaomi
          # fragments) does not reproduce it: the alioth fragment turns on
          # CONFIG_CRYPTO_LZ4HC=y, which the shipped kernel has disabled, and
          # that symbol does not even compile in this tree (crypto/lz4hc.c uses
          # the upstream-only name LZ4HC_DEFAULT_CLEVEL; lib/lz4/lz4hc.h only
          # defines LZ4HC_CLEVEL_DEFAULT).
          cp ../config/device.config out/.config
          scripts/kconfig/merge_config.sh -O out -m out/.config ../config/ksu.fragment
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CC="ccache clang" CXX="ccache clang++" olddefconfig
          grep -q '^CONFIG_KSU=y' out/.config
          grep -q '^CONFIG_KSU_SUSFS=y' out/.config
          # LTO/CFI/SCS are enabled in the shipped kernel; keep parity.
          grep -q '^CONFIG_LTO_CLANG=y' out/.config
          grep -q '^CONFIG_CFI_CLANG=y' out/.config
          grep -q '^CONFIG_SHADOW_CALL_STACK=y' out/.config

      - name: Build Image
        run: |
          cd kernel
          # Match the stock PixelOS kernel's uname -v / Linux version banner.
          # mkcompile_h uses KBUILD_BUILD_TIMESTAMP verbatim.
          export KBUILD_BUILD_VERSION=1
          export KBUILD_BUILD_USER=ci
          export KBUILD_BUILD_HOST=PixelOS-CI
          export KBUILD_BUILD_TIMESTAMP='Thu Nov 12 09:32:12 CET 2026'
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CC="ccache clang" CXX="ccache clang++" \
            -j"${{ inputs.jobs }}" Image
          ccache -s || true
          test -f out/arch/arm64/boot/Image
          echo "kernel.release: $(cat out/include/config/kernel.release)"
          test "$(cat out/include/config/kernel.release)" = "4.19.325-cip136-st20-perf-gf914d0b24613"

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ hashFiles('patches/**','config/**','ksu/**') }}-${{ github.run_id }}

      - name: Upload kernel Image (early)
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image-${{ github.run_number }}
          path: kernel/out/arch/arm64/boot/Image

      - name: Fetch stock boot.img from PixelOS ROM
        run: |
          curl -L --max-time 1800 --connect-timeout 30 --retry 3 --retry-delay 5 -o rom.zip "${{ inputs.rom_url }}"
          unzip -p rom.zip payload.bin > payload.bin
          curl -L --retry 3 -o pdg.tar.gz \
            https://github.com/ssut/payload-dumper-go/releases/download/2.1.0/payload-dumper-go_2.1.0_linux_amd64.tar.gz
          tar xzf pdg.tar.gz
          ./payload-dumper-go -o dump -p boot payload.bin
          ls -lh dump
          rm -f rom.zip payload.bin

      - name: Repack boot.img with the new kernel
        run: |
          git clone --depth 1 https://android.googlesource.com/platform/system/tools/mkbootimg tools-mkbootimg
          python3 tools-mkbootimg/unpack_bootimg.py \
            --boot_img dump/boot.img --out boot_out --format=mkbootimg > mkbootimg.args
          cp kernel/out/arch/arm64/boot/Image boot_out/kernel
          sh -c "python3 tools-mkbootimg/mkbootimg.py $(cat mkbootimg.args) --output boot-ksu.img"
          ls -lh boot-ksu.img
          sha256sum boot-ksu.img kernel/out/arch/arm64/boot/Image > SHA256SUMS

      - name: Fetch KernelSU-Next manager
        run: |
          curl -L --retry 3 -o KernelSU_Next_v3.4.2_33355-release.apk \
            https://github.com/KernelSU-Next/KernelSU-Next/releases/download/v3.4.2/KernelSU_Next_v3.4.2_33355-release.apk

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pixelos-alioth-ksu-${{ github.run_number }}
          if-no-files-found: error
          # .config is a dotfile: upload-artifact skips hidden files otherwise.
          include-hidden-files: true
          path: |
            boot-ksu.img
            SHA256SUMS
            KernelSU_Next_v3.4.2_33355-release.apk
            kernel/out/arch/arm64/boot/Image
            kernel/out/System.map
            kernel/out/.config
